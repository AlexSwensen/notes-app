name: Publish

# Runs when a (draft) release is published on GitHub.
on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  docker:
    name: Publish Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag is a version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not a version like v1.2.3"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Docker Hub is optional: set the DOCKERHUB_USERNAME variable and DOCKERHUB_TOKEN secret to enable it.
      - uses: docker/login-action@v4
        if: vars.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Fixed image name, so renaming the GitHub repo doesn't move the image.
          images: |
            ghcr.io/${{ github.repository_owner }}/sheafly
            name=docker.io/${{ vars.DOCKERHUB_USERNAME }}/sheafly,enable=${{ vars.DOCKERHUB_USERNAME != '' }}
          # latest=auto only tags stable versions (not pre-releases like v2.0.0-beta.1) as latest.
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Needs a Docker Hub token with Read, Write, Delete scope; Read & Write can't edit descriptions.
      - name: Update Docker Hub description
        if: vars.DOCKERHUB_USERNAME != ''
        uses: peter-evans/dockerhub-description@v5
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ vars.DOCKERHUB_USERNAME }}/sheafly
          short-description: Self-hosted, Notion-style notes with sync across devices, offline support and search
          enable-url-completion: true
