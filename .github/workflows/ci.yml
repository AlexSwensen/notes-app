name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run on main: it may be in the middle of a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Check migrations match the schema
        run: |
          npm run db:generate -w @sheafly/server
          if [ -n "$(git status --porcelain apps/server/drizzle)" ]; then
            echo "::error::The Drizzle schema has changes without a migration. Run 'npm run db:generate -w @sheafly/server' and commit the result."
            exit 1
          fi

  test-server:
    name: Server tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run tests with coverage
        shell: bash # enables pipefail so a failing test run isn't masked by tee
        run: npm run test:coverage -w @sheafly/server | tee server-tests.log
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Server coverage'
            echo '```'
            sed -n '/start of coverage report/,/end of coverage report/p' server-tests.log | sed 's/^ℹ //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: server-coverage
          path: apps/server/coverage
          if-no-files-found: ignore

  test-client:
    name: Client tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Run tests with coverage
        shell: bash # enables pipefail so a failing test run isn't masked by tee
        run: npm run test:coverage -w @sheafly/client | tee client-tests.log
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Client coverage'
            echo '```'
            grep -E '^\s*(File|All files|-+\|)|^\s+\S+\.tsx?\s+\|' client-tests.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: client-coverage
          path: apps/client/coverage
          if-no-files-found: ignore

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Draft release
    needs: [lint, test-server, test-client, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Pushes with a deploy key: it's the ruleset's only bypass, and GITHUB_TOKEN can't bypass on personal repos.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Run via npx so semantic-release's bundled npm stays out of the project's dependencies.
        # Preset v9, not v10: v10 needs conventional-changelog-writer@9, release-notes-generator@14 uses writer@8.
        run: >-
          npx --yes
          -p semantic-release@25
          -p @semantic-release/changelog@7
          -p @semantic-release/git@11
          -p @semantic-release/exec@7
          -p conventional-changelog-conventionalcommits@9
          semantic-release
          --repository-url git@github.com:${{ github.repository }}.git
